<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Detail — VNR Infra</title>
<meta name="description" content="Read our latest real estate insights and updates.">
<link rel="canonical" href="https://vnrinfradevelopers.com/blog-detail.html">
<meta property="og:type" content="article">
<meta property="og:title" content="Blog Detail — VNR Infra">
<meta property="og:url" content="https://vnrinfradevelopers.com/blog-detail.html">
<meta property="og:image" content="https://vnrinfradevelopers.com/favicon.png">
<meta property="og:description" content="Read our latest real estate insights and updates.">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.png" sizes="any" type="image/png">
<link rel="apple-touch-icon" href="https://vnrinfradevelopers.com/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .article-header { padding: 140px 0 40px; text-align: center; }
  .article-meta { 
    font-family: var(--mono); 
    font-size: 0.85rem; 
    color: var(--steel); 
    margin-bottom: 24px; 
    text-transform: uppercase; 
    letter-spacing: 0.05em; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: 12px; 
  }
  .article-meta span.badge { 
    background: var(--blueprint); 
    color: #fff; 
    padding: 6px 12px; 
    border-radius: 20px; 
    font-size: 0.75rem; 
    font-weight: 600; 
  }
  .article-title { 
    font-size: clamp(2rem, 4vw, 3.2rem); 
    max-width: 900px; 
    margin: 0 auto; 
    line-height: 1.2;
  }
  .article-banner { 
    width: 100%; 
    max-width: 1000px; 
    margin: 0 auto 60px; 
    border-radius: 12px; 
    overflow: visible; 
    box-shadow: 0 12px 32px rgba(20,24,28,0.1); 
    position: relative;
    background: transparent;
  }
  .article-banner img { 
    width: 100%; 
    height: auto; 
    display: block; 
    object-fit: contain;
    margin: 0 auto;
    border-radius: 12px; /* Re-apply border radius directly to image since wrapper overflow is visible */
  }
  .article-content { 
    max-width: 720px; 
    margin: 0 auto 80px; 
    font-size: 1.12rem; 
    line-height: 1.8; 
    color: var(--ink); 
  }
  .article-content p { margin-bottom: 1.6em; }
  .article-content h2 { margin: 2em 0 1em; font-size: 2rem; }
  .article-content h3 { margin: 1.5em 0 0.8em; font-size: 1.5rem; }
  .article-content ul, .article-content ol { margin-bottom: 1.6em; padding-left: 20px; }
  .article-content li { margin-bottom: 0.5em; }
  
  .related-articles { background: var(--paper); padding: 96px 0; border-top: 1px solid var(--line); }
  .cta-section { 
    padding: 96px 0; 
    text-align: center; 
    background: linear-gradient(135deg, var(--blueprint) 0%, #0c2b4d 100%); 
    color: #fff; 
  }
  .cta-section h2 { color: #fff; margin-bottom: 24px; }
  .cta-section .btn-primary {
    background: var(--brass);
    color: var(--ink);
    border-color: var(--brass);
  }
  .cta-section .btn-primary:hover {
    background: #d4a96b;
    border-color: #d4a96b;
  }
</style>
</head>
<body>

<div class="grid-overlay" aria-hidden="true"></div>
<div id="header-root"></div>

<main id="top">
  <div id="loading-state" class="wrap" style="padding: 160px 0; text-align: center;">
    <p style="color: var(--steel); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em;">Loading article...</p>
  </div>
  
  <div id="error-state" class="wrap" style="display: none; padding: 160px 0; text-align: center;">
    <h2>Article Not Found</h2>
    <p style="color: var(--steel); margin: 20px 0 40px;">The article you're looking for doesn't exist or has been removed.</p>
    <a href="blogs.html" class="btn btn-primary">Back to Blogs</a>
  </div>

  <article id="blog-article" style="display: none;">
    <div class="wrap" style="padding-top: 120px;">
      <div class="article-banner" style="margin-top: 0; margin-bottom: 40px;">
        <img id="blog-image" src="" alt="" loading="lazy" onerror="this.src='assets/logo.png'">
      </div>
    </div>

    <header class="article-header wrap" style="padding: 0 0 40px; text-align: center;">
      <div class="article-meta">
        <span class="badge" id="blog-category"></span>
        <span id="blog-date"></span>
      </div>
      <h1 class="article-title" id="blog-title"></h1>
    </header>

    <div class="wrap">
      <div class="article-content" id="blog-content"></div>
    </div>
  </article>

  <section class="cta-section" id="blog-cta" style="display: none;">
    <div class="wrap">
      <h2>Ready to invest in your future?</h2>
      <p style="margin-bottom: 40px; font-size: 1.1rem; max-width: 600px; margin-inline: auto; opacity: 0.9;">Explore our HMDA and DTCP approved layouts around Hyderabad and secure your dream property today.</p>
      <button type="button" class="btn btn-primary" data-lead-action="Site Visit" data-lead-project="Blog CTA">Book a Site Visit</button>
    </div>
  </section>

  <section class="related-articles" id="related-section" style="display: none;">
    <div class="wrap">
      <div class="section-head" style="text-align: center; margin: 0 auto 48px;">
        <h2 style="margin-bottom: 0;">Related Articles</h2>
      </div>
      <div class="project-grid" id="related-grid"></div>
    </div>
  </section>

</main>

<div id="footer-root"></div>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/blog-detail.js"></script>
</body>
</html>
